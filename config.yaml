server:
  address: "127.0.0.1:8080"
  read_header_timeout: 10s
  read_timeout: 0s
  write_timeout: 0s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_header_bytes: 1048576

admin:
  enabled: false
  address: "127.0.0.1:9091"

policy:
  file: policy.yaml
  watch_interval: 1s

rate_limit:
  enabled: true
  backend: memory
  redis:
    address: "127.0.0.1:6379"
    username: ""
    password: ""
    key: "token-router:rate-limit:global"
    db: 0
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    tls: false

telemetry:
  service_name: token-router
  service_instance_id: ""
  service_version: dev
  environment: development
  shutdown_timeout: 5s
  otlp:
    enabled: false
    endpoint: "http://127.0.0.1:4318"
    timeout: 5s
  traces:
    enabled: true
    sample_ratio: 1
  metrics:
    enabled: true
    export_interval: 15s
    prometheus:
      enabled: true
      address: "127.0.0.1:9090"
      path: "/metrics"
  logs:
    enabled: true
    level: info
    format: json
