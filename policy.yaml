upstream:
  base_urls:
    - "https://api.openai.com"
  routes: []
  max_routing_body_bytes: 8388608
  api_key: ""
  organization: ""
  project: ""
  request_timeout: 0s

rate_limit:
  requests_per_second: 10
  burst: 20
  tokens_per_second: 0
  token_burst: 0
  account:
    enabled: false
    jwt_claim: sub
